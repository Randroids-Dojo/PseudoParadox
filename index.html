<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo Paradox</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        color: #ddd;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #app canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 12px;
        font-size: 12px;
        opacity: 0.6;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">Pseudo Paradox prototype</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
